<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Sentinel</title>
<style>
  #summary {
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 1px solid #2a3a5a;
    background: #101624;
    color: #8ab4f8;
    font-size: 12px;
    text-align: center;
    border-radius: 8px;
  }
  #summary .count { font-weight: 700; color: #b8d4ff; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    width: 420px;
    padding: 16px;
    background: #0f0f12;
    color: #eaeaea;
  }
  h1 { margin: 0 0 8px; font-size: 16px; color: #66c0ff; }
  p.sub { margin: 0 0 16px; font-size: 12px; color: #9aa0a6; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
  button {
    background:#2a2a33; border:1px solid #444; color:#eaeaea;
    padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px;
  }
  button:hover { border-color:#66c0ff; }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.primary:hover { background:#165fcc; }
  button.danger { background:#4b1a1a; border-color:#6b2a2a; }
  button.danger:hover { background:#6b2a2a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .badge {
    display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px;
    margin-left:6px; background:#2a2a33; color:#9aa0a6;
  }
  .badge.cause-baseline { background:#1f3a1f; color:#8fcf8f; }
  .badge.cause-page_js_cookie_write { background:#4a2a1a; color:#ffb36b; }
  .badge.cause-cookie_changed { background:#3a3a1f; color:#ffd166; }
  ul { list-style:none; padding:0; margin:0; max-height:340px; overflow-y:auto; }
  li {
    border:1px solid #2a2a33; border-radius:8px; padding:10px 12px;
    margin-bottom:8px; background:#16161a;
  }
  li .row { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
  li .name { font-weight:700; color:#66c0ff; font-size:13px; }
  li .domain { color:#9aa0a6; font-size:12px; }
  li .time { color:#6b7280; font-size:11px; }
  li .value { word-break:break-all; font-size:11px; color:#9aa0a6; margin-top:4px; font-family: ui-monospace, SFMono-Regular, monospace; }
  .empty { color:#6b7280; font-size:13px; padding:12px 0; text-align:center; }
  .hint { font-size:11px; color:#6b7280; margin-top:10px; line-height:1.45; }
</style>
</head>
<body>
<h1>Session Sentinel</h1>
<p class="sub">Local detection alerts for session cookies on your chosen domains. Nothing is uploaded.</p>

<div id="summary"></div>

<div class="toolbar">
  <button id="btnRefresh" class="primary">Refresh</button>
  <button id="btnClear" class="danger">Clear all</button>
  <button id="btnPause" class="primary">Pause monitoring</button>
  <span class="badge" id="badgeCount">0</span>
</div>

<ul id="list"></ul>
<p class="empty" id="empty">No alerts yet.</p>
<p class="hint">Masked values only. Cookie values never leave your browser.</p>

<script src="popup.js"></script>
</body>
</html>
